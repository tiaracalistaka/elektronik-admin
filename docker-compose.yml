version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: elektronik_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: elektronik
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin123
    ports:
      - "3307:3306"
    volumes:
      - ./docker/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
